repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (autoformat)
        entry: isort
        language: system
        types: [python]
        exclude: 'migrations/'
         

      - id: black
        name: black (autoformat)
        entry: black
        language: system
        types: [python]
        exclude: 'migrations/'
        args: ["--line-length=120"]  

      - id: flake8
        name: flake8 (lint)
        entry: flake8
        language: system
        types: [python]
        exclude: 'migrations/'
        

      - id: mypy
        name: mypy (static typing)
        entry: mypy
        language: system
        types: [python]
        exclude: 'migrations/'
        args: ["--strict", "--ignore-missing-imports"]  
        